name: Discovered Materials
description: Discovered Materials (legally matforge inc) is a Y Combinator-backed (Spring 2026)
  startup based in San Francisco building AI scientists for the semiconductor industry. The company
  uses swarms of AI agents to run the full materials-discovery pipeline - generating candidate
  materials, synthesizing them, and testing them in physical laboratories - to find novel materials
  for datacenters and fabrication facilities. Their stated goal is to compress a process that
  traditionally takes 10+ years of lab work into months, targeting 10x-better alternatives for
  applications such as nanoscale interconnects. Founded by Akash Ramdas (Stanford materials-science
  PhD/postdoc) and Advaith Sridhar (Carnegie Mellon AI, formerly Luma Labs and Persona AI). At the
  time of profiling the company exposes no public API, developer portal, or documentation; this
  entry is an enrichment lead maintained in the API Evangelist network.
